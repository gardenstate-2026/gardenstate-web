<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D 단지 배치도</title>
  <style>
    html, body, #scene { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #e8ece5; }
    canvas { display: block; touch-action: none; }
    #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; font: 600 11px system-ui,sans-serif; }
    .label, .pin { position: absolute; left: 0; top: 0; white-space: nowrap; }
    .label { color: #33443c; background: #fffffff0; border-radius: 5px; padding: 2px 5px; box-shadow: 0 1px 3px #24322b24; }
    .pin { pointer-events: auto; width: 14px; height: 14px; padding: 0; border-radius: 50%; border: 2px solid white; box-shadow: 0 1px 3px #19261b80; cursor: pointer; }
    .pin[aria-pressed="true"], .pin:focus-visible { outline: 3px solid #193b35; z-index: 2; }
  </style>
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
</head>
<body>
  <main id="scene" aria-label="아파트 단지 3D 배치도"></main>
  <div id="labels"></div>
  <script type="module">
    import("./viewer.js").catch(() => parent.postMessage({ type: "gardenstate:unavailable" }, location.origin));
  </script>
</body>
</html>
