<title>아파트 조경 3D 시뮬레이터 — 산책로·소음·민원·A/B/C안</title>
<style>
:root{--ink:#17231e;--muted:#5e6d66;--card:rgba(255,255,255,.86);--line:rgba(23,35,30,.12);--accent:#2f8f6b;--chip:#f1f4f2}
body.night{--ink:#e8eef0;--muted:#9fb0ab;--card:rgba(14,20,26,.82);--line:rgba(255,255,255,.12);--chip:rgba(255,255,255,.07)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:#d7e6ee}
#app{position:fixed;inset:0}
canvas{display:block;touch-action:none}
.card{position:fixed;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.12);transition:background .6s,color .6s;z-index:5}
button{font:inherit;color:inherit;cursor:pointer}
#left{top:14px;left:14px;width:300px;padding:16px;max-height:calc(100vh - 110px);overflow:auto}
#left .eyebrow{font-size:11px;color:var(--muted);letter-spacing:.2px}
#left h1{font-size:18px;margin:2px 0 12px;font-weight:800;letter-spacing:-.4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);padding:4px;border-radius:11px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 4px;font-size:12.5px;line-height:1.25}
.seg button b{display:block;font-size:14px}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);color:#17231e}
body.night .seg button.on{background:#2a3640;color:#fff}
.desc{font-size:12px;color:var(--muted);margin:10px 0 8px;line-height:1.55}
.desc ul{margin:4px 0 0;padding-left:16px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.m{background:var(--chip);border-radius:10px;padding:8px 10px}
.m span{display:block;font-size:11px;color:var(--muted)}
.m b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.m b small{font-size:11px;font-weight:500;margin-left:2px;color:var(--muted)}
.vote{margin-top:10px;width:100%;border:0;background:var(--accent);color:#fff;border-radius:10px;padding:10px;font-weight:700;font-size:13.5px}
.vote:disabled{opacity:.6;cursor:default}
.rows{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.row{display:grid;grid-template-columns:62px 1fr 40px;gap:8px;align-items:center;font-size:12px}
.row b{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.track{height:8px;background:var(--chip);border-radius:5px;overflow:hidden}
.fill{height:100%;border-radius:5px;transition:width .5s}
.note{font-size:10.5px;color:var(--muted);margin-top:8px}
#right{top:14px;right:14px;width:270px;padding:14px 16px;max-height:calc(100vh - 110px);overflow:auto}
#right h2{font-size:14.5px;margin:0 0 4px;font-weight:800}
#right .sub{font-size:11.5px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 10px;font-size:12px}
.chips button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.legend{display:flex;flex-direction:column;gap:5px;font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
#bar{left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;align-items:center;max-width:calc(100vw - 20px);overflow-x:auto}
#bar button{border:0;background:transparent;padding:9px 13px;border-radius:10px;font-size:13px;white-space:nowrap}
#bar button:hover{background:var(--chip)}
#bar button.on{background:var(--accent);color:#fff}
#bar .sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
#tip{position:fixed;z-index:6;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;display:none;box-shadow:0 6px 18px rgba(0,0,0,.15);backdrop-filter:blur(10px)}
/* 3D labels */
.lb{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.88);color:#25302b;border:1px solid rgba(0,0,0,.08);white-space:nowrap;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.lb.bd{background:#2c3a35;color:#fff;font-size:12px}
.lb.fac{font-weight:600}
.lb.road{background:rgba(70,74,80,.85);color:#fff}
.pin{font-size:11.5px;font-weight:700;padding:4px 9px 4px 7px;border-radius:999px;color:#fff;white-space:nowrap;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.2);display:flex;align-items:center;gap:5px}
.pin:before{content:"!";display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#fff;color:inherit;font-size:10px}
.pin.hi{background:#e2463b}.pin.hi:before{color:#e2463b}
.pin.md{background:#f2a23a}.pin.md:before{color:#e08a00}
.cp{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:9px;background:#fff;color:#222;white-space:nowrap;pointer-events:none;border:2px solid;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.cp.pred{border-style:dashed}
.hide{display:none!important}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#5e6d66;font-size:14px}
@media (max-width:820px){
  body:not(.embed) #left{width:auto;right:14px;max-height:42vh;padding:12px}
  body:not(.embed) #left h1{font-size:15px;margin-bottom:8px}
  body:not(.embed) #right{top:auto;bottom:126px;left:14px;right:14px;width:auto}
  body:not(.embed) #bar{width:max-content;flex-wrap:wrap;justify-content:center}
  body:not(.embed) #bar button{padding:7px 8px;font-size:12px}
  body:not(.embed) #bar .sep{display:none}
  body:not(.embed) .metrics{grid-template-columns:repeat(5,1fr);gap:4px}
  body:not(.embed) .m{padding:6px}body:not(.embed) .m span{font-size:9.5px}body:not(.embed) .m b{font-size:14px}
  body:not(.embed) #left .desc,body:not(.embed) #left .eyebrow,body:not(.embed) #voteBars,body:not(.embed) #left .note{display:none}
  body:not(.embed) .vote{padding:7px;margin-top:6px}
  body:not(.embed) #right{max-height:24vh}
}
/* Embed controls stay compact independently of the iframe width. */
.embed #left{width:min(300px,calc(100% - 20px));top:10px;left:10px;padding:7px;max-height:75vh}
.embed #left h1,.embed #left .eyebrow{display:none}
.embed #planSeg{margin:0}
.embed #planSeg button{padding:5px 4px}
.embed #planSeg button b{margin:0;font-size:14px}
.embed #planDetails{margin-top:6px}
.embed details summary{cursor:pointer;font-size:12px;font-weight:600;padding:6px 8px}
.embed #layerDetails{top:10px;right:10px;width:min(260px,calc(100% - 20px))}
.embed #layerDetails:not([open]){width:auto}
.embed #right{position:static;width:auto;max-height:min(55vh,440px);padding:5px 10px 10px;box-shadow:none;border:0;background:none}
.embed #bar{width:max-content;max-width:calc(100% - 12px);bottom:6px;flex-wrap:nowrap;overflow-x:auto}
.embed #bar button{flex:none;padding:7px 8px;font-size:11px}
.embed #bar .sep{height:16px;margin:0 2px}
@media (max-width:620px){
  .embed #layerDetails{top:auto;bottom:52px}
}

<body>
<div id="loading">아파트 단지 3D 모델 불러오는 중…</div>
<div id="app"></div>

<div id="left" class="card">
  <div class="eyebrow">8개 동 예시 단지 · 설계안 비교</div>
  <h1>아파트 조경 3D 시뮬레이터</h1>
  <div class="seg" id="planSeg">
    <button data-p="A"><b>A안</b>최소 보완</button>
    <button data-p="B"><b>B안</b>시설 재배치</button>
    <button data-p="C"><b>C안</b>재배치+동선 분리</button>
  </div>
  <div class="desc" id="planDesc"></div>
  <div class="metrics" id="metrics"></div>
  <button class="vote" id="voteBtn">👍 이 안에 투표</button>
  <div class="rows" id="voteBars"></div>
  <div class="note">시설 배치와 수치는 시연용 예시입니다.</div>
</div>

<div id="right" class="card"></div>

<div id="bar" class="card">
  <button data-l="base" class="on">기본 보기</button>
  <button data-l="route">① 산책 동선</button>
  <button data-l="noise">② 소음 사정거리</button>
  <button data-l="cmp">③ 민원 히트맵</button>
  <span class="sep"></span>
  <button id="bNight">🌙 야간</button>
  <button id="bRot">자동 회전</button>
  <button id="bLbl" class="on">라벨</button>
  <button id="bZoomIn" title="확대" aria-label="확대">+</button>
  <button id="bZoomOut" title="축소" aria-label="축소">−</button>
  <button id="bHome">시점 초기화</button>
</div>
<div id="tip"></div>

<script>
  if (new URLSearchParams(location.search).get("embed") === "1") {
    document.body.classList.add("embed");
    const left = document.getElementById("left");
    const planDetails = document.createElement("details");
    planDetails.id = "planDetails";
    planDetails.open = true;
    const planSummary = document.createElement("summary");
    planSummary.textContent = "설계안 설명 · 지표 · 투표";
    planDetails.append(planSummary);
    const plans = document.getElementById("planSeg");
    while (plans.nextElementSibling) planDetails.append(plans.nextElementSibling);
    left.append(planDetails);

    const right = document.getElementById("right");
    const layerDetails = document.createElement("details");
    layerDetails.id = "layerDetails";
    layerDetails.className = "card";
    const layerSummary = document.createElement("summary");
    layerSummary.textContent = "레이어 상세";
    right.before(layerDetails);
    layerDetails.append(layerSummary, right);
    right.classList.remove("card");
  }
</script>

  } else if (L === 'route') {

    R.innerHTML = `<h2>① 부딪히지 않는 산책로</h2><div class="sub">${PLANS[st.plan].split ? '이용자 유형별로 분리된 동선입니다.' : '모든 이용자가 한 산책로를 공유해 충돌 지점이 생깁니다.'}</div>
      <div class="chips" id="uChips">${[['all', '전체'], ...Object.entries(UN)].map(([k, n]) => `<button data-u="${k}" class="${st.user === k ? 'on' : ''}">${n}</button>`).join('')}</div>
      <div class="kpis"><div class="m"><span>동선 충돌 지점</span><b style="color:${n > 1 ? '#e2463b' : '#e08a00'}">${n}<small>곳</small></b></div>
      <div class="m"><span>무단차 연결률</span><b>${con}</b></div>
      <div class="m"><span>반려견–놀이터 이격</span><b style="font-size:15px">${gap}</b></div>
      <div class="m"><span>동선 민원 위험</span><b style="color:${risk > 60 ? '#e2463b' : '#2f8f6b'}">${risk}</b></div></div>
      <div class="legend">${Object.entries(UN).map(([k, n]) => `<div><i style="background:${UC[k]}"></i>${n}</div>`).join('')}</div>`;
    document.querySelectorAll('#uChips button').forEach(b => b.onclick = () => { st.user = b.dataset.u; refreshLayer(); });
    drawRoutes();
  } else if (L === 'noise') {
    drawNoise();
    R.innerHTML = `<h2>② 소음·불편 사정거리</h2><div class="sub">${st.night ? '🌙 야간·새벽 기준 — 농구장·분리수거 영향이 커집니다.' : '☀ 주간 기준 — 하단 🌙 야간 버튼으로 시간대를 바꿔 보세요.'} 동 색상은 노출 등급입니다.</div>
      <div class="kpis"><div class="m"><span>고노출 세대</span><b style="color:${hi ? '#e2463b' : '#2f8f6b'}">${hi}<small>세대</small></b></div>
      <div class="m"><span>주의 세대</span><b style="color:${mid ? '#e08a00' : '#2f8f6b'}">${mid}<small>세대</small></b></div></div>
      <div class="rows">${buildings.map(b => `<div class="row"><span>${b.id}동</span><div class="track"><div class="fill" style="width:${Math.max(4, b.exp * 100)}%;background:${['#7fbf8f', '#f2a23a', '#e2463b'][b.lvl]}"></div></div><b>${Math.round(b.exp * 100)}</b></div>`).join('')}</div>
      <div class="note">간이 거리 감쇠 + 시간대 보정 모델 (배치안 비교용 상대 지표)</div>`;
  } else if (L === 'cmp') {
    drawCmp();
    const k = st.cmpMode, tot = {}; CMP.forEach(d => tot[d.c] = (tot[d.c] || 0) + d.v[k]); const mx = Math.max(...Object.values(tot));
    R.innerHTML = `<h2>③ 민원 히트맵</h2><div class="sub">민원이 쌓이는 자리를 기둥 높이로 표시합니다. (도면 원안 위치 기준)</div>
      <div class="seg" id="cMode" style="grid-template-columns:1fr 1fr;margin-bottom:8px"><button data-k="0" class="${k ? '' : 'on'}">🏗 재건축 실제</button><button data-k="1" class="${k ? 'on' : ''}">🏢 신축 예측</button></div>
      <div class="chips" id="cChips">${[['all', '전체'], ...Object.entries(CN)].map(([c, n]) => `<button data-c="${c}" class="${st.cmpF === c ? 'on' : ''}">${n}</button>`).join('')}</div>
      <div class="rows">${Object.keys(CN).map(c => `<div class="row"><span>${CN[c]}</span><div class="track"><div class="fill" style="width:${tot[c] / mx * 100}%;background:${CC[c]}"></div></div><b>${tot[c]}건</b></div>`).join('')}</div>`;
    document.querySelectorAll('#cMode button').forEach(b => b.onclick = () => { st.cmpMode = +b.dataset.k; refreshLayer(); });
    document.querySelectorAll('#cChips button').forEach(b => b.onclick = () => { st.cmpF = b.dataset.c; refreshLayer(); });
  }
}
document.querySelectorAll('#bar [data-l]').forEach(b => b.onclick = () => { st.layer = b.dataset.l; refreshLayer(); });
$('bNight').onclick = e => { st.night = !st.night; e.currentTarget.classList.toggle('on', st.night); document.body.classList.toggle('night', st.night); e.currentTarget.textContent = st.night ? '☀ 주간' : '🌙 야간'; refreshLayer(); };
$('bRot').onclick = e => { controls.autoRotate = !controls.autoRotate; e.currentTarget.classList.toggle('on', controls.autoRotate); };
$('bLbl').onclick = e => { st.labels = !st.labels; e.currentTarget.classList.toggle('on', st.labels); labelR.domElement.style.display = st.labels ? '' : 'none'; };
function zoomCamera(factor) {
  const offset = camera.position.clone().sub(controls.target);
  const distance = THREE.MathUtils.clamp(
    offset.length() * factor,
    controls.minDistance,
    controls.maxDistance
  );

  camera.position.copy(controls.target).add(
    offset.normalize().multiplyScalar(distance)
  );

  controls.update();
}

$('bZoomIn').onclick = () => zoomCamera(0.85);
$('bZoomOut').onclick = () => zoomCamera(1.18);

$('bHome').onclick = () => {
  camera.position.copy(HOME.pos);
  controls.target.copy(HOME.tgt);
  fitEmbedCamera();
  camera.updateProjectionMatrix();
  controls.update();
};

// 동 클릭 정보
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  const tip = $('tip');
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(buildings.map(b => b.body))[0];
  if (!hit) { tip.style.display = 'none'; return; }
  const b = buildings.find(b => b.body === hit.object); noiseCalc();
  const fl = Math.max(1, Math.min(b.fl, Math.floor((hit.point.y - BASE) / FH) + 1));
  tip.innerHTML = `<b>${b.id}동 ${fl}층</b><br>${b.fl}층 · ${b.hh}세대<br>소음 노출 ${Math.round(b.exp * 100)} (${['양호', '주의', '고노출'][b.lvl]}, ${st.night ? '야간' : '주간'})`;
  Object.assign(tip.style, { display: 'block', left: Math.min(e.clientX + 14, innerWidth - 190) + 'px', top: (e.clientY + 14) + 'px' });
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; fitEmbedCamera(); camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); labelR.setSize(innerWidth, innerHeight); });

// ======================= 애니메이션 =======================
applyPlan(true);
const clock = new THREE.Clock(); let lastNightPaint = -1;
const pt = new THREE.Vector3();
function placeOnPath(a, path, len, dt, pingpong = false) {
  a.t += a.dir * a.sp * dt / len;
  if (pingpong) { if (a.t > 1) { a.t = 1; a.dir = -1; } if (a.t < 0) { a.t = 0; a.dir = 1; } }
  else a.t = (a.t % 1 + 1) % 1;
  const p = path.getPointAt(a.t), tg = path.getTangentAt(a.t);
  const w = P(p.x, p.y), nx = -tg.y, nz = tg.x;
  a.g.position.set(w.x + nx * a.off, 0.2, w.z + nz * a.off);
  a.g.rotation.y = Math.atan2(tg.x * a.dir, tg.y * a.dir);
}
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  // 주야간
  st.nightT += ((st.night ? 1 : 0) - st.nightT) * Math.min(1, dt * 3);
  const n = st.nightT;
  scene.background.copy(DAY).lerp(NIGHT, n); scene.fog.color.copy(scene.background);
  hemi.intensity = THREE.MathUtils.lerp(1.15, 0.32, n); sun.intensity = THREE.MathUtils.lerp(2.5, 0.22, n);
  sun.color.setHex(n > .5 ? 0x9fb4ff : 0xfff0d8);
  M.lamp.emissiveIntensity = n * 3;
  if (Math.abs(n - lastNightPaint) > 0.02) { paintWindows(n); lastNightPaint = n; }
  // 시설 재배치 애니메이션
  for (const k in facG) {
    const f = facG[k];
    if (f.t < 1) { f.t = Math.min(1, f.t + dt * 0.7); const e = f.t < .5 ? 2 * f.t * f.t : 1 - Math.pow(-2 * f.t + 2, 2) / 2; f.g.position.lerpVectors(f.from, f.to, e); f.g.position.y = Math.sin(Math.PI * f.t) * 12; }
    f.scale += (f.scaleTo - f.scale) * Math.min(1, dt * 4); f.g.scale.setScalar(Math.max(0.001, f.scale)); f.g.visible = f.scale > 0.01;
  }
  for (const g of [barrier, buffer]) { g.scale.y += ((g.userData.to ?? 0) - g.scale.y) * Math.min(1, dt * 2.5); g.scale.y = Math.max(0.001, g.scale.y); g.visible = g.scale.y > 0.01; }
  // 주민 이동
  const split = PLANS[st.plan].split, focus = st.layer === 'route' ? st.user : 'all';
  for (const a of agents) {
    if (split && a.type === 'b') placeOnPath(a, bikePath, LEN.bike, dt);
    else if (split && a.type === 'd') placeOnPath(a, dogPath, LEN.dog, dt, true);
    else placeOnPath(a, loopPath, LEN.loop, dt);
    a.g.visible = focus === 'all' || focus === a.type;
  }
  // 차량
  carData.forEach((c, i) => {
    c.s += c.v * dt * (c.lane < 2 ? 1 : -1); if (c.s > 450) c.s -= 900; if (c.s < -450) c.s += 900;
    if (c.hw) { tmp.position.set(c.s, 0.85, P(0, [10, 18, 28, 36][c.lane]).z); tmp.rotation.set(0, 0, 0); }
    else { tmp.position.set(P([868, 876, 886, 894][c.lane], 0).x, 0.85, -c.s); tmp.rotation.set(0, Math.PI / 2, 0); }
    tmp.scale.set(1, 1, 1); tmp.updateMatrix(); cars.setMatrixAt(i, tmp.matrix);
  });
  cars.instanceMatrix.needsUpdate = true;
  // 레이어 효과
  if (noiseG.visible) noiseG.children.forEach(o => { if (o.userData.R) { const ph = (time * 0.35 + o.userData.ph) % 1; o.scale.setScalar(Math.max(0.01, ph * o.userData.R)); o.material.opacity = (1 - ph) * .75; } });
  if (pinG.visible) pinG.children.forEach(o => { if (o.userData.pulse) o.scale.setScalar(1 + 0.25 * Math.sin(time * 4)); });
  if (cmpG.visible) cmpG.children.forEach(o => { if (o.userData.spin) { o.rotation.y = time * 1.2; o.position.y += Math.sin(time * 2) * 0.01; } });
  // 숨겨진 그룹의 라벨 동기화
  scene.traverse(o => {
    if (!o.isCSS2DObject) return;
    let v = o.userData.want !== false && !(o.userData.fac && st.layer === 'cmp');
    for (let p = o.parent; v && p; p = p.parent) if (!p.visible) v = false;
    o.visible = v;
  });
  controls.update();
  renderer.render(scene, camera); labelR.render(scene, camera);
});
</script>
